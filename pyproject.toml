[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "valkyrie-protocol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.163", "pydantic>=2.9,<3", "uvicorn[standard]>=0.30,<0.55"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app" = ["content.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
